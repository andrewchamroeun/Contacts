<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 18px;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #243447;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(30, 55, 80, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            color: #234e70;
        }

        .intro {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: #526575;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0 24px;
        }

        th, td {
            padding: 13px 16px;
            border-bottom: 1px solid #dce5ec;
            text-align: left;
        }

        th {
            background: #234e70;
            color: white;
        }

        tr:nth-child(even) td {
            background: #f3f7fa;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .button-area {
            text-align: center;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            background: #2673a6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1c587f;
        }

        .note {
            margin-bottom: 0;
            text-align: center;
            color: #667887;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>My Contacts</h1>
        <p class="intro">Choose a slot number to look up a contact's name.</p>

        <table>
            <thead>
                <tr>
                    <th>Slot #</th>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>0</td><td>Arnold</td></tr>
                <tr><td>1</td><td>Sly</td></tr>
                <tr><td>2</td><td>Dwayne</td></tr>
                <tr><td>3</td><td>Vin</td></tr>
                <tr><td>4</td><td>JCVD</td></tr>
                <tr><td>5</td><td>Steven</td></tr>
            </tbody>
        </table>

        <div class="button-area">
            <button type="button" onclick="
                let searchAgain = 'yes';

                while (searchAgain.toLowerCase() == 'yes') {
                    let slotNumber = prompt('Enter the slot number (0-5) for the contact you want to see:');

                    if (slotNumber == null) {
                        searchAgain = 'no';
                    } else {
                        let i = 0;

                        while (i < contacts.length && i != slotNumber) {
                            i++;
                        }

                        if (i < contacts.length) {
                            alert('You selected ' + contacts[i] + '.');
                            searchAgain = prompt('Would you like to select another name? Enter yes or no.');
                        } else {
                            alert('That slot number was not found.');
                            searchAgain = prompt('Would you like to try another slot? Enter yes or no.');
                        }

                        if (searchAgain == null) {
                            searchAgain = 'no';
                        }
                    }
                }
            ">Look Up a Contact</button>
        </div>

        <p class="note">There are six contacts in this list. Valid slot numbers are 0 through 5.</p>
    </main>

    <script type="text/javascript">
        // Store the contact names in one array.
        const contacts = ["Arnold", "Sly", "Dwayne", "Vin", "JCVD", "Steven"];
    </script>
</body>
</html>
